syntax = "proto3";

package minigame.room.v1;

option go_package = "minigame/gen/go/room/v1;roomv1";

import "common/v1/common.proto";

// 匹配服务或网关创建房间时使用，players 最少可只传创建者自己。
message CreateRoomRequest {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  minigame.common.v1.MatchMode mode = 3;
  repeated minigame.common.v1.PlayerRef players = 4;
  int64 created_at_ms = 5;
}

message CreateRoomResponse {
  minigame.common.v1.ResponseStatus status = 1;
  Room room = 2;
}

message JoinRoomRequest {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  string gateway_id = 4;
  string session_id = 5;
}

message JoinRoomResponse {
  minigame.common.v1.ResponseStatus status = 1;
  Room room = 2;
}

message GetRoomRequest {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
}

message GetRoomResponse {
  minigame.common.v1.ResponseStatus status = 1;
  Room room = 2;
}

// 2D 坐标向量，当前同步层先围绕位置、朝向和速度来设计。
message Vector2 {
  float x = 1;
  float y = 2;
}

// 客户端每次上报自己的当前状态，服务端会覆盖缓存并广播新的房间快照。
message TransformState {
  Vector2 position = 1;
  Vector2 direction = 2;
  Vector2 velocity = 3;
  uint64 state_seq = 4;
  int64 client_time_ms = 5;
  int64 server_time_ms = 6;
  // 玩家状态：0=存活 1=幽灵（死亡） 2=已通关。远端用于同步透明度等表现。
  int32 player_state = 7;
  // 朝向：true=面向左。静止时 direction 为 0 无法表达朝向，故单独上报。
  bool facing_left = 8;
  // 滞空（跳跃或坠落中）：远端用于驱动 Animator bIsJumping 参数。
  bool is_jumping = 9;
}

message SyncPlayerStateRequest {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  TransformState transform = 4;
}

message SyncPlayerStateResponse {
  minigame.common.v1.ResponseStatus status = 1;
  uint64 accepted_tick = 2;
}

// gateway 为每个 WebSocket 会话建立一个订阅流，房间快照通过该流主动推送。
message SubscribeRoomRequest {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  string gateway_id = 4;
  string session_id = 5;
}

// 玩家输入先保留为兼容接口，后续战斗判定再复用。
message PlayerInput {
  int32 move_x = 1;
  int32 move_y = 2;
  bool cast_skill = 3;
}

message SubmitPlayerInputRequest {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  uint64 tick = 4;
  PlayerInput input = 5;
}

message SubmitPlayerInputResponse {
  minigame.common.v1.ResponseStatus status = 1;
  uint64 accepted_tick = 2;
}

// 大厅等待阶段：设置自己的准备状态，服务端广播 RoomUpdated。
message SetReadyRequest {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  bool ready = 4;
}

message SetReadyResponse {
  minigame.common.v1.ResponseStatus status = 1;
  bool ready = 2;
}

// 房主在全员准备后发起开局，服务端校验后把房间 phase 切为 BATTLE 并广播 RoomUpdated。
message StartGameRequest {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
}

message StartGameResponse {
  minigame.common.v1.ResponseStatus status = 1;
  Room room = 2;
}

// 房间大厅状态推送：成员进出、准备变化、游戏开始时由服务端主动广播给房间全员。
message RoomUpdated {
  Room room = 1;
  // 变更原因：player_joined / player_left / ready_changed / game_started
  string reason = 2;
}

message RoomPlayerState {
  minigame.common.v1.PlayerRef player = 1;
  int32 hp = 2;
  int32 energy = 3;
  int32 score = 4;
  bool connected = 5;
  bool alive = 6;
  TransformState transform = 7;
  // 大厅等待阶段的准备状态（房主恒定视为已准备）
  bool ready = 8;
  // 玩家色号（服务器按进房顺序分配，客户端查本地色板，保证各端颜色一致且互不撞色）
  int32 color_index = 9;
}

message Room {
  string room_id = 1;
  minigame.common.v1.MatchMode mode = 2;
  minigame.common.v1.RoomPhase phase = 3;
  repeated RoomPlayerState players = 4;
  uint64 current_tick = 5;
  int64 started_at_ms = 6;
  int64 finished_at_ms = 7;
  // 房主玩家ID（创建者），用于客户端判定是否展示"开始游戏"按钮
  string owner_player_id = 8;
}

// 房间快照用于服务端主动同步客户端状态，客户端拿到后可以直接做插值和表现层更新。
message RoomSnapshot {
  string room_id = 1;
  minigame.common.v1.RoomPhase phase = 2;
  uint64 tick = 3;
  repeated RoomPlayerState players = 4;
  int64 server_time_ms = 5;
  minigame.common.v1.TraceContext trace = 6;
}

message SettlementPlayerResult {
  string player_id = 1;
  int32 hp = 2;
  int32 rank = 3;
  int32 mmr_delta = 4;
  int32 coin_delta = 5;
}

message Settlement {
  string room_id = 1;
  string winner_player_id = 2;
  repeated SettlementPlayerResult results = 3;
  int64 settled_at_ms = 4;
}

// ==================== 道具选择阶段同步 ====================
// 阶段由服务器触发：服务器抽取道具列表并推送 ItemOfferList，
// 先到先得由服务器仲裁（ItemClaimConfirm 按收到顺序判定）。

// 服务器 → 全房间：选择阶段开始，下发本轮道具列表
message ItemOfferList {
  string room_id = 1;
  int32 round = 2;                    // 第几轮选择
  repeated ItemOffer offers = 3;
  int64 server_time_ms = 4;
}

message ItemOffer {
  int32 slot_index = 1;               // 槽位/道具点位编号
  string item_id = 2;                 // 道具ID（客户端按ID从本地配置取prefab/图标）
  Vector2 position = 3;               // 道具在场景中的位置（玩家需走到的点）
}

// 客户端 → 服务器：玩家点击某道具，声明"我要前往认领"（不锁道具，纯表现广播）
message ItemClaimIntent {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  int32 slot_index = 4;
}

// 服务器 → 全房间：透传认领意图，其他端可让远端化身走向该道具
message ItemClaimIntentBroadcast {
  string room_id = 1;
  string player_id = 2;
  int32 slot_index = 3;
  int64 server_time_ms = 4;
}

// 客户端 → 服务器：玩家到达道具位置并点击打勾，请求确认认领（仲裁点）
message ItemClaimConfirm {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  int32 slot_index = 4;
  int64 client_time_ms = 5;
}

// 服务器 → 全房间：认领仲裁结果。先到先得，被抢的玩家收到 success=false。
message ItemClaimResult {
  string room_id = 1;
  int32 slot_index = 2;
  string item_id = 3;
  // 本次确认的发起者 player_id：success=true 表示其认领成功；false 表示其被抢。
  string player_id = 4;
  bool success = 5;                   // 对发起者而言是否成功
  minigame.common.v1.ResultCode code = 6; // OK=成功 / CONFLICT=已被其他玩家认领
  int64 server_time_ms = 7;
}

// ==================== 游戏阶段切换同步 ====================

// 游戏阶段枚举：服务器通过 GamePhaseSync 统一下发阶段切换，客户端不再本地自动切换。
enum GamePhaseKind {
  GAME_PHASE_KIND_UNSPECIFIED = 0;
  GAME_PHASE_KIND_PROP_SELECTION = 1;   // 道具选择阶段（伴随 ItemOfferList 下发）
  GAME_PHASE_KIND_PROP_PLACEMENT = 2;   // 道具布置阶段
  GAME_PHASE_KIND_PLAYING = 3;          // 跑动/游玩阶段
  GAME_PHASE_KIND_ROUND_SETTLEMENT = 4; // 单轮结算
  GAME_PHASE_KIND_FINAL_SETTLEMENT = 5; // 最终结算
}

// 服务器 → 全房间：阶段切换指令。客户端收到后进入对应阶段。
// 进入道具选择阶段时通常与 ItemOfferList 先后下发（本消息负责切阶段，ItemOfferList 负责发牌）。
message GamePhaseSync {
  string room_id = 1;
  GamePhaseKind phase = 2;
  int32 round = 3;              // 当前轮次（从 1 开始）
  int64 server_time_ms = 4;
}

// ==================== 道具摆放阶段同步 ====================

// 网格格子坐标
message GridCell {
  int32 x = 1;
  int32 y = 2;
}

// 客户端 → 服务器：摆放中道具的拖拽状态（约 10Hz 节流上报，仅表现用）。
message ItemPlaceState {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  string item_id = 4;             // 道具ID（= prefab 名称）
  Vector2 position = 5;           // 道具根节点世界坐标
  bool rotated = 6;               // 是否旋转 90°
}

// 服务器 → 全房间：透传拖拽状态，各端生成远端玩家的虚化道具跟随显示。
message ItemPlaceStateBroadcast {
  string room_id = 1;
  string player_id = 2;
  string item_id = 3;
  Vector2 position = 4;
  bool rotated = 5;
}

// 客户端 → 服务器：确认摆放请求（占用仲裁点）。
// cells 为客户端按道具 footprint 计算的占据格子列表，服务器逐个检查冲突。
message ItemPlaceConfirm {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  string item_id = 4;
  GridCell anchor_cell = 5;       // footprint 左下角锚点格子
  bool rotated = 6;
  repeated GridCell cells = 7;    // 本道具占据的全部格子
  int64 client_time_ms = 8;
}

// 服务器 → 全房间：摆放仲裁结果。先到先得，格子冲突则失败。
// 成功时各端把 cells 标记为占用并生成该玩家的实体道具。
message ItemPlaceResult {
  string room_id = 1;
  string player_id = 2;           // 本次确认的发起者
  bool success = 3;
  minigame.common.v1.ResultCode code = 4; // OK=成功 / CONFLICT=格子已被占用
  string item_id = 5;
  GridCell anchor_cell = 6;
  bool rotated = 7;
  repeated GridCell cells = 8;
  int64 server_time_ms = 9;
}

// ==================== 通关/出局裁决与结算同步 ====================

// 出局类型
enum PlayerOutType {
  PLAYER_OUT_TYPE_UNSPECIFIED = 0;
  PLAYER_OUT_TYPE_FINISHED = 1;   // 到达终点（通关）
  PLAYER_OUT_TYPE_DEAD = 2;       // 死亡/幽灵（出局）
}

// 客户端 → 服务器：本地玩家通关或死亡出局时立即上报（比快照更及时，供服务器裁决）。
message PlayerOutReport {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  PlayerOutType out_type = 4;
  int64 client_time_ms = 5;
}

// 服务器 → 全房间：出局裁决广播。通关名次由服务器按收到 PlayerOutReport 的顺序分配。
message PlayerOutBroadcast {
  string room_id = 1;
  string player_id = 2;
  PlayerOutType out_type = 3;
  int32 finish_rank = 4;          // 通关名次（1=第一名）；非通关出局时为 0
  int64 server_time_ms = 5;
}

// 客户端 → 服务器：收到 GamePhaseSync{ROUND_SETTLEMENT} 并完成本地结算后，
// 上报本轮得分，服务器汇总排名后广播 Settlement。
message RoundScoreReport {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  int32 round = 4;
  int32 score = 5;                // 本轮得分（与客户端 ScoreCalculator 口径一致）
}

// ==================== 瞬时事件 / 拾取裁决 / 道具生命周期 ====================

// 一次性表现事件类型（跳跃/受击/拾取/死亡等，只同步表现，逻辑各端自算）
enum PlayerEventType {
  PLAYER_EVENT_TYPE_UNSPECIFIED = 0;
  PLAYER_EVENT_TYPE_JUMP = 1;       // 起跳（音效/尘土特效）
  PLAYER_EVENT_TYPE_HIT = 2;        // 受击/击退
  PLAYER_EVENT_TYPE_PICKUP = 3;     // 拾取（金币等）
  PLAYER_EVENT_TYPE_DIE = 4;        // 死亡瞬间（爆炸/死亡音效，区别于持续的幽灵状态）
}

// 客户端 → 服务器：本地一次性事件，服务器原样广播。
message PlayerEvent {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  PlayerEventType event_type = 4;
  Vector2 position = 5;             // 事件发生位置（远端播特效/音效定位用）
}

// 服务器 → 全房间：透传一次性事件。
message PlayerEventBroadcast {
  string room_id = 1;
  string player_id = 2;
  PlayerEventType event_type = 3;
  Vector2 position = 4;
  int64 server_time_ms = 5;
}

// 客户端 → 服务器：拾取收集物（先到先得裁决）。
// pickup_id 约定：关卡初始金币 = "coin_{anchorX}_{anchorY}"；道具生成的收集物 = "{itemId}_{anchorX}_{anchorY}_{序号}"
message PickupClaim {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;
  string pickup_id = 4;
}

// 服务器 → 全房间：拾取裁决广播（同一 pickup_id 只认第一次）。
// 各端收到后销毁对应收集物；拾取者端计分，其他端仅移除。
message PickupClaimBroadcast {
  string room_id = 1;
  string player_id = 2;             // 拾取者
  string pickup_id = 3;
  int64 server_time_ms = 4;
}

// 道具生命周期状态（炸弹引爆/闹钟响起/销毁等，计时由各端本地推演，只同步触发瞬间）
enum ItemStateType {
  ITEM_STATE_TYPE_UNSPECIFIED = 0;
  ITEM_STATE_TYPE_TRIGGERED = 1;    // 道具触发（炸弹爆炸/闹钟响起/风扇启动等）
  ITEM_STATE_TYPE_DESTROYED = 2;    // 道具销毁（爆炸后/被拆除）
}

// 客户端 → 服务器：道具所有者在道具状态变化瞬间上报，服务器原样广播。
// item_instance_id 约定："{itemId}_{anchorX}_{anchorY}"（摆放仲裁结果可推导，各端一致）
message ItemStateEvent {
  minigame.common.v1.TraceContext trace = 1;
  string room_id = 2;
  string player_id = 3;             // 道具所有者
  string item_instance_id = 4;
  ItemStateType state_type = 5;
}

// 服务器 → 全房间：透传道具状态事件。
message ItemStateEventBroadcast {
  string room_id = 1;
  string player_id = 2;
  string item_instance_id = 3;
  ItemStateType state_type = 4;
  int64 server_time_ms = 5;
}

service RoomService {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);
  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
  rpc SetReady(SetReadyRequest) returns (SetReadyResponse);
  rpc StartGame(StartGameRequest) returns (StartGameResponse);
  rpc SubmitPlayerInput(SubmitPlayerInputRequest) returns (SubmitPlayerInputResponse);
  rpc SyncPlayerState(SyncPlayerStateRequest) returns (SyncPlayerStateResponse);
  rpc SubscribeRoom(SubscribeRoomRequest) returns (stream RoomSnapshot);
  rpc SendClaimIntent(ItemClaimIntent) returns (minigame.common.v1.ResponseStatus);
  rpc ConfirmClaim(ItemClaimConfirm) returns (ItemClaimResult);
}
