syntax = "proto3";

package minigame.account.v1;

option go_package = "minigame/gen/go/account/v1;accountv1";

import "common/v1/common.proto";

// 客户端首次登录请求，使用 device_id/open_id 做最小闭环认证。
message LoginRequest {
  minigame.common.v1.TraceContext trace = 1;
  string device_id = 2;
  string open_id = 3;
  string client_version = 4;
  // 账号密码登录（可选）。填写后服务端优先按账号密码校验；
  // 留空则回退 device_id 免注册登录（旧逻辑，proto3 新增字段向后兼容）。
  string username = 5;
  string password = 6;
}

message LoginResponse {
  minigame.common.v1.ResponseStatus status = 1;
  string token = 2;
  minigame.common.v1.PlayerProfile player = 3;
  int64 expires_at_ms = 4;
}

message GetPlayerRequest {
  minigame.common.v1.TraceContext trace = 1;
  string player_id = 2;
  string token = 3;
}

message GetPlayerResponse {
  minigame.common.v1.ResponseStatus status = 1;
  minigame.common.v1.PlayerProfile player = 2;
}

message ValidateTokenRequest {
  minigame.common.v1.TraceContext trace = 1;
  string token = 2;
}

message ValidateTokenResponse {
  minigame.common.v1.ResponseStatus status = 1;
  string player_id = 2;
  minigame.common.v1.PlayerProfile player = 3;
}

// 退出登录：使当前 token 立即失效；幂等（token 已失效也返回成功）
message LogoutRequest {
  minigame.common.v1.TraceContext trace = 1;
  string token = 2;   // 客户端不用填，服务端以连接绑定为准（填了也会被覆盖）
}

message LogoutResponse {
  minigame.common.v1.ResponseStatus status = 1;
}

service AccountService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}
