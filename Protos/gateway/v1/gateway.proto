syntax = "proto3";

package minigame.gateway.v1;

option go_package = "minigame/gen/go/gateway/v1;gatewayv1";

import "account/v1/account.proto";
import "common/v1/common.proto";
import "match/v1/match.proto";
import "room/v1/room.proto";

// 客户端定时上行心跳，网关负责回包并刷新连接活跃时间。
message HeartbeatRequest {
  int64 client_time_ms = 1;
}

message HeartbeatResponse {
  int64 server_time_ms = 1;
  int64 client_time_ms = 2;
}

// 通用错误响应用于承接坏包、未知路由或网关级别的异常。
message ErrorResponse {
  minigame.common.v1.ResponseStatus status = 1;
  string route = 2;
}

// WebSocket 二进制帧统一封装结构，后续网关按 oneof 类型路由到不同服务。
message ClientEnvelope {
  minigame.common.v1.TraceContext trace = 1;
  uint64 seq = 2;

  oneof payload {
    HeartbeatRequest heartbeat = 10;
    minigame.account.v1.LoginRequest login = 11;
    minigame.account.v1.GetPlayerRequest get_player = 12;
    minigame.match.v1.StartMatchRequest start_match = 13;
    minigame.match.v1.CancelMatchRequest cancel_match = 14;
    minigame.match.v1.GetTicketRequest get_ticket = 15;
    minigame.room.v1.JoinRoomRequest join_room = 16;
    minigame.room.v1.SubmitPlayerInputRequest submit_player_input = 17;
    minigame.room.v1.CreateRoomRequest create_room = 18;
    minigame.room.v1.SyncPlayerStateRequest sync_player_state = 19;
    minigame.room.v1.SetReadyRequest set_ready = 20;
    minigame.room.v1.StartGameRequest start_game = 21;
    minigame.room.v1.GetRoomRequest get_room = 22;
    minigame.room.v1.ItemClaimIntent item_claim_intent = 23;
    minigame.room.v1.ItemClaimConfirm item_claim_confirm = 24;
    minigame.room.v1.ItemPlaceState item_place_state = 25;
    minigame.room.v1.ItemPlaceConfirm item_place_confirm = 26;
    minigame.room.v1.PlayerOutReport player_out_report = 27;
    minigame.room.v1.RoundScoreReport round_score_report = 28;
    minigame.room.v1.PlayerEvent player_event = 29;
    minigame.room.v1.PickupClaim pickup_claim = 30;
    minigame.room.v1.ItemStateEvent item_state_event = 31;
    // GM 调试指令：强制切阶段（0~5 对应 GamePhaseKind）。无同步应答，生效后全房间收到 GamePhaseSync。
    minigame.room.v1.GmSetPhase gm_set_phase = 32;
    // 陷阱击杀上报：纯透传，无同步应答，广播 TrapKillBroadcast 给其他端。
    minigame.room.v1.TrapKillEvent trap_kill_event = 33;
    // 拆除类道具确认：服务器按爆破范围计算被拆除道具，广播 ItemDemolishResult。
    minigame.room.v1.ItemDemolishConfirm item_demolish_confirm = 34;
    // 退出房间：离开当前所在房间。
    minigame.room.v1.LeaveRoomRequest leave_room = 35;
    // 退出登录：使当前 token 立即失效；幂等。
    minigame.account.v1.LogoutRequest logout = 36;
    // 旋转吐司尺寸上报：纯透传，无同步应答，广播 ToastSizeBroadcast 给全房间。
    minigame.room.v1.ToastSizeSync toast_size_sync = 37;
    // 事件3（言出法随）子类型上报：无同步应答，状态通过 RoomSnapshot.event3_states 下发。
    minigame.room.v1.ReportEvent3Subtype report_event3_subtype = 38;
    // 事件3 音量超标玩家上报：无同步应答，状态通过 RoomSnapshot.event3_states 下发。
    minigame.room.v1.ReportEvent3LoudPlayer report_event3_loud_player = 39;
    // 选关投票：等待阶段任意玩家投票/改票，同步应答 VoteLevelResponse，并广播 RoomUpdated(level_voted)。
    minigame.room.v1.VoteLevelRequest vote_level = 40;
  }
}

// 网关返回给客户端的统一结构，既支持同步应答，也支持服务端推送。
message ServerEnvelope {
  minigame.common.v1.TraceContext trace = 1;
  uint64 seq = 2;

  oneof payload {
    HeartbeatResponse heartbeat = 10;
    minigame.account.v1.LoginResponse login = 11;
    minigame.account.v1.GetPlayerResponse get_player = 12;
    minigame.match.v1.StartMatchResponse start_match = 13;
    minigame.match.v1.CancelMatchResponse cancel_match = 14;
    minigame.match.v1.GetTicketResponse get_ticket = 15;
    minigame.match.v1.MatchAssignment match_assignment = 16;
    minigame.room.v1.JoinRoomResponse join_room = 17;
    minigame.room.v1.RoomSnapshot room_snapshot = 18;
    minigame.room.v1.Settlement settlement = 19;
    minigame.room.v1.SubmitPlayerInputResponse submit_player_input = 20;
    minigame.room.v1.CreateRoomResponse create_room = 21;
    minigame.room.v1.SyncPlayerStateResponse sync_player_state = 22;
    minigame.room.v1.SetReadyResponse set_ready = 23;
    minigame.room.v1.StartGameResponse start_game = 24;
    minigame.room.v1.RoomUpdated room_updated = 25;
    minigame.room.v1.GetRoomResponse get_room = 26;
    minigame.room.v1.ItemOfferList item_offer_list = 27;
    minigame.room.v1.ItemClaimIntentBroadcast item_claim_intent_broadcast = 28;
    minigame.room.v1.ItemClaimResult item_claim_result = 29;
    minigame.room.v1.GamePhaseSync game_phase_sync = 30;
    minigame.room.v1.ItemPlaceStateBroadcast item_place_state_broadcast = 31;
    minigame.room.v1.ItemPlaceResult item_place_result = 32;
    minigame.room.v1.PlayerOutBroadcast player_out_broadcast = 33;
    minigame.room.v1.PlayerEventBroadcast player_event_broadcast = 34;
    minigame.room.v1.PickupClaimBroadcast pickup_claim_broadcast = 35;
    minigame.room.v1.ItemStateEventBroadcast item_state_event_broadcast = 36;
    minigame.room.v1.TrapKillBroadcast trap_kill_broadcast = 37;
    minigame.room.v1.ItemDemolishResult item_demolish_result = 38;
    // 退出房间同步应答。
    minigame.room.v1.LeaveRoomResponse leave_room = 39;
    // 退出登录同步应答。
    minigame.account.v1.LogoutResponse logout = 40;
    minigame.room.v1.ToastSizeBroadcast toast_size_broadcast = 41;
    // 选关投票同步应答（VoteLevel 的回包）。
    minigame.room.v1.VoteLevelResponse vote_level = 42;
    ErrorResponse error = 90;
  }
}
